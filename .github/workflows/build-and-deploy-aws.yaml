name: Build And Deploy To AWS

# Runs only when the repo variable DEPLOY_TARGET is "aws" (build-and-deploy.yaml handles GCP otherwise).
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_REPOSITORY: ${{ vars.AWS_IMAGE_REPOSITORY }}
  INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}

jobs:
  ci:
    if: vars.DEPLOY_TARGET == 'aws'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Docker Auth
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/sgame-backend:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}/sgame-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/sgame-frontend:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}/sgame-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: AWS Auth
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy
      run: |
        id=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "sgame deploy ${{ github.sha }}" \
          --parameters 'commands=["systemctl restart sgame"]' \
          --query Command.CommandId --output text)

        # sgame.service may take up to its 5 min start timeout, longer than `aws ssm wait` allows.
        for _ in $(seq 1 72); do
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          case "$status" in
            Pending|InProgress|Delayed) sleep 5 ;;
            *) break ;;
          esac
        done

        aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
          --query '[StandardOutputContent, StandardErrorContent]' --output text
        echo "Status: $status"
        test "$status" = Success

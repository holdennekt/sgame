host: localhost:8080
info:
  contact: {}
  description: Backend API for SGame (Go + Next.js).
  title: SGame API
  version: "1.0"
paths:
  /guest:
    post:
      consumes:
      - application/json
      description: Creates a temporary guest session using a display name, sets an
        HttpOnly cookie
      parameters:
      - description: Guest login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GuestLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in as guest
          headers:
            Set-Cookie:
              description: session_id=abc...; HttpOnly; Path=/
              type: string
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Guest Login
      tags:
      - auth
  /lobby:
    get:
      description: |-
        Establishes a WebSocket connection to the global lobby.
        Requires a valid session cookie. Once connected, sends a chat message "{User} has connected".
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: 'Unauthorized: Session missing'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Connect to Lobby WebSocket
      tags:
      - lobby
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates user, creates a session, and sets an HttpOnly cookie
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          headers:
            Set-Cookie:
              description: session_id=abc...; HttpOnly; Path=/
              type: string
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'Unauthorized: Invalid credentials'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: User Login
      tags:
      - auth
  /logout:
    delete:
      description: Invalidates the current session and clears the session cookie
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: User Logout
      tags:
